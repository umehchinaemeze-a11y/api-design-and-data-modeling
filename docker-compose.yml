services:
  postgres:
    image: postgres:16-alpine
    container_name: urban-glide-postgres
    restart: always
    environment:
      POSTGRES_USER: urbanglider
      POSTGRES_PASSWORD: glidepassword
      POSTGRES_DB: urbanglide_db
    ports:
      - "15436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
